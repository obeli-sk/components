[[activity_wasm]]
name = "activity_sendgrid_email"
location = "oci://docker.io/getobelisk/components_sendgrid_activity_sendgrid_email:2026-03-30@sha256:57a81ffd4e70487832dd7bc04b96494ae1239285e35897dbdabca781335fd384"
