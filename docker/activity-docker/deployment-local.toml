return_type = "result<string, string>"

[[activity_exec]]
ffqn = "obelisk-docker:activity-docker/volumes.rm"
location = "${DEPLOYMENT_DIR}/scripts/volume-rm.sh"
env_vars = ["PATH"]
params = [
    { name = "name", type = "string" },
]
