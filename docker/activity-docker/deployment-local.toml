[[activity_exec]]
ffqn = "obelisk-docker:activity-docker/volumes.exists"
location = "${DEPLOYMENT_DIR}/scripts/volume-exists.sh"
env_vars = ["PATH"]
params = [
    { name = "name", type = "string" },
]
return_type = "result<bool, string>"
