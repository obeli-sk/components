[workspace]
resolver = "2"
members = [
    "fly/activity-fly-http",
    "fly/webhook-fly-secrets-updater",
    "github/activity-github-graphql",
    "http/activity-http-generic",
    "obelisk/activity-obelisk-client-http",
    "openai/activity-openai-responses",
]

[workspace.package]
version = "0.1.0"
license = "MIT"
authors = ["Project Developers"]
edition = "2024"
repository = "TBD"
rust-version = "1.89.0"

[workspace.dependencies]
anyhow = "1.0"
assert_matches = "1.5.0"
cynic = "3.13.2"
cynic-codegen = "3.13.2"
derive_more = { version = "2.1.1", features = ["debug", "display", "from"] }
futures-concurrency = "7.7.1"
heck = "0.5.0"
insta = "1.48.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "2.0.1"
wasip2 = "1.0.4"
wit-bindgen  = "0.61.0"
wit-bindgen-rust = "0.61.0"
wit-parser = "0.253.0"
wstd = "0.6.5"

[profile.release]
opt-level = "s"

[profile.release_activity]
inherits = "release"
strip = "debuginfo"

[profile.release_webhook]
inherits = "release"
debug = "line-tables-only"
