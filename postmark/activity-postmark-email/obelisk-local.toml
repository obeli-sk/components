[[activity_wasm]]
name = "activity_postmark_email"
location = "target/wasm32-wasip2/release_activity/activity_postmark_email.wasm"
exec.lock_expiry.seconds = 30
env_vars = [{key="POSTMARK_API_URL", value="${POSTMARK_API_URL:-https://api.postmarkapp.com/email}"}]
[[activity_wasm.allowed_host]]
pattern = "${POSTMARK_API_DOMAIN:-api.postmarkapp.com}"
methods = ["POST"]
[activity_wasm.allowed_host.secrets]
env_vars = ["POSTMARK_SERVER_TOKEN"]
replace_in = ["headers"]
