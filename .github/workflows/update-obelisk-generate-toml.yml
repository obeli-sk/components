name: update-obelisk-generate-toml

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: true
        type: string
        default: "main"
      obelisk_branch:
        description: "The obelisk repo branch to base the PR on"
        required: true
        type: string
        default: "main"

defaults:
  run:
    shell: bash -xe {0}

jobs:
  update-obelisk-generate-toml:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout components repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}
          path: components

      - name: Checkout obelisk repo
        uses: actions/checkout@v5
        with:
          repository: obeli-sk/obelisk
          ref: ${{ github.event.inputs.obelisk_branch }}
          token: ${{ secrets.GH_TOKEN_PR_RW }}
          path: obelisk

      - name: Generate obelisk-generate.toml
        run: |
          cd components
          ./scripts/generate-obelisk-toml.sh ../obelisk/obelisk-generate.toml

      - name: Check for changes
        id: check-changes
        run: |
          cd obelisk
          if git diff --quiet obelisk-generate.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          cd obelisk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate unique branch name
        if: steps.check-changes.outputs.changed == 'true'
        id: branch-name
        run: echo "branch_name=update-obelisk-generate-toml-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          cd obelisk
          git checkout -b ${{ steps.branch-name.outputs.branch_name }}
          git add obelisk-generate.toml
          git commit -m "chore: Update obelisk-generate.toml from components"
          git push origin ${{ steps.branch-name.outputs.branch_name }}
          curl -v --fail -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/obeli-sk/obelisk/pulls" \
            -d "$(jq -n \
                  --arg title 'chore: Update obelisk-generate.toml from components' \
                  --arg head "${{ steps.branch-name.outputs.branch_name }}" \
                  --arg base "${{ github.event.inputs.obelisk_branch }}" \
                  --arg body 'Auto-generated from obeli-sk/components' \
                  '{title: $title, head: $head, base: $base, body: $body}')"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR_RW }}

      - name: No changes detected
        if: steps.check-changes.outputs.changed == 'false'
        run: echo "No changes detected in obelisk-generate.toml, skipping PR creation."
